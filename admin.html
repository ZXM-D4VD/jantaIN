<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JanSeva - Admin Control Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root { --primary: #0f172a; --bg: #f1f5f9; --card: #ffffff; --border: #cbd5e1; --accent: #2563eb; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--primary); padding: 1.5rem; }

    .header { background: var(--primary); color: white; padding: 1.2rem 2rem; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
    .stat-card { background: white; padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .stat-card h4 { color: #64748b; font-size: 0.85rem; text-transform: uppercase; }
    .stat-card p { font-size: 1.8rem; font-weight: 800; margin-top: 0.4rem; color: var(--accent); }

    .card { background: var(--card); padding: 1.8rem; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
    th { background: #f8fafc; font-weight: 700; color: #475569; }

    .badge { padding: 0.3rem 0.7rem; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }
    .badge-pending { background: #fef3c7; color: #b45309; }
    .badge-resolved { background: #d1fae5; color: #047857; }

    input, select, textarea, button { padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border); outline: none; }
    button { background: var(--accent); color: white; border: none; font-weight: 700; cursor: pointer; }

    #login-gate { max-width: 400px; margin: 6rem auto; text-align: center; }
  </style>
</head>
<body>

  <div id="login-gate" class="card">
    <h2 style="margin-bottom:1rem;"><i class="fa-solid fa-shield-halved" style="color:var(--accent);"></i> Admin Login</h2>
    <input type="password" id="passkey" placeholder="Enter Code (9090)" style="width:100%; margin-bottom:1rem;">
    <button onclick="login()" style="width:100%;">Unlock Admin Dashboard</button>
  </div>

  <div id="admin-panel" style="display:none;">
    <div class="header">
      <h2><i class="fa-solid fa-gauge-high"></i> JanSeva Admin Console</h2>
      <a href="index.html" style="color:white; text-decoration:none; font-weight:600;"><i class="fa-solid fa-arrow-right-from-bracket"></i> Exit</a>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><h4>Total Requests</h4><p id="stat-total">0</p></div>
      <div class="stat-card"><h4>Pending Tickets</h4><p id="stat-pending" style="color:#d97706;">0</p></div>
      <div class="stat-card"><h4>Resolved Tickets</h4><p id="stat-resolved" style="color:#059669;">0</p></div>
    </div>

    <!-- Live Requests Table -->
    <div class="card">
      <h3><i class="fa-solid fa-database"></i> Saved User Requests (Realtime)</h3>
      <table>
        <thead>
          <tr>
            <th>Ticket ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Category</th>
            <th>City</th>
            <th>Details</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="requests-tbody"></tbody>
      </table>
    </div>

    <!-- Add New Campaign Form -->
    <div class="card">
      <h3><i class="fa-solid fa-plus-circle"></i> Create New Campaign</h3>
      <form id="campaign-form" style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem; margin-top:1rem;">
        <input type="text" id="c-title" placeholder="Campaign Title" required>
        <input type="number" id="c-target" placeholder="Target Amount (₹)" required>
        <input type="text" id="c-icon" placeholder="Icon Class (e.g. fa-school)" required>
        <textarea id="c-desc" placeholder="Campaign Description..." style="grid-column: span 2;" required></textarea>
        <button type="submit" style="grid-column: span 2;">Publish Campaign</button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = window.env?.NEXT_PUBLIC_SUPABASE_URL || "https://your-project-id.supabase.co";
    const SUPABASE_ANON_KEY = window.env?.NEXT_PUBLIC_SUPABASE_ANON_KEY || "your-actual-anon-key";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function login() {
      if (document.getElementById('passkey').value === "9090") {
        document.getElementById('login-gate').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        fetchRequests();
        subscribeRealtime();
      } else { alert("Incorrect Passcode!"); }
    }

    async function fetchRequests() {
      const { data, error } = await supabaseClient.from('requests').select('*').order('created_at', { ascending: false });
      if (error) return;

      document.getElementById('stat-total').innerText = data.length;
      document.getElementById('stat-pending').innerText = data.filter(d => d.status === 'Pending').length;
      document.getElementById('stat-resolved').innerText = data.filter(d => d.status === 'Resolved').length;

      document.getElementById('requests-tbody').innerHTML = data.map(r => `
        <tr>
          <td><b>${escapeHtml(r.ticket_id)}</b></td>
          <td>${escapeHtml(r.full_name)}</td>
          <td>${escapeHtml(r.email)}</td>
          <td>${escapeHtml(r.category)}</td>
          <td>${escapeHtml(r.city)}</td>
          <td>${escapeHtml(r.details)}</td>
          <td><span class="badge ${r.status === 'Resolved' ? 'badge-resolved' : 'badge-pending'}">${escapeHtml(r.status)}</span></td>
          <td>
            <button onclick="toggleStatus('${r.id}', '${r.status}')" style="padding:0.3rem 0.6rem; font-size:0.8rem;">Toggle Status</button>
          </td>
        </tr>
      `).join('');
    }

    async function toggleStatus(id, currentStatus) {
      const nextStatus = currentStatus === 'Pending' ? 'Resolved' : 'Pending';
      await supabaseClient.from('requests').update({ status: nextStatus }).eq('id', id);
      fetchRequests();
    }

    document.getElementById('campaign-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      await supabaseClient.from('campaigns').insert([{
        title: document.getElementById('c-title').value,
        target_amount: parseFloat(document.getElementById('c-target').value),
        icon: document.getElementById('c-icon').value,
        description: document.getElementById('c-desc').value,
        raised_amount: 0
      }]);
      alert("Campaign Added!");
      document.getElementById('campaign-form').reset();
    });

    function subscribeRealtime() {
      supabaseClient.channel('admin-updates')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'requests' }, () => fetchRequests())
        .subscribe();
    }
  </script>
</body>
</html>
