<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Public Grievances</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen">

  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
        <h1 class="font-extrabold text-base tracking-tight">Admin Portal (Realtime Console)</h1>
      </div>
      <a href="index.html" class="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl hover:bg-slate-700 transition">← Back to Main Site</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

    <!-- DATA STATS -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-white p-4 rounded-2xl border shadow-sm">
        <p class="text-xs font-bold text-slate-400">TOTAL REQUESTS</p>
        <p id="stat-total" class="text-2xl font-black text-slate-900 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-2xl border shadow-sm">
        <p class="text-xs font-bold text-amber-500">PENDING RESOLUTION</p>
        <p id="stat-pending" class="text-2xl font-black text-amber-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-2xl border shadow-sm">
        <p class="text-xs font-bold text-emerald-500">RESOLVED TICKETS</p>
        <p id="stat-resolved" class="text-2xl font-black text-emerald-600 mt-1">0</p>
      </div>
    </div>

    <!-- TICKET TABLE -->
    <div class="bg-white rounded-3xl border shadow-sm overflow-hidden">
      <div class="p-4 border-b flex justify-between items-center bg-slate-50/50">
        <h2 class="font-extrabold text-sm text-slate-900">Submitted Citizen Grievances</h2>
        <button onclick="clearAllData()" class="text-xs text-red-600 hover:underline font-bold">Clear Database</button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-slate-100 text-slate-600 border-b">
              <th class="p-3 font-bold">Ticket ID</th>
              <th class="p-3 font-bold">Applicant</th>
              <th class="p-3 font-bold">Contact</th>
              <th class="p-3 font-bold">Category</th>
              <th class="p-3 font-bold">Details</th>
              <th class="p-3 font-bold">Status</th>
              <th class="p-3 font-bold text-right">Action</th>
            </tr>
          </thead>
          <tbody id="admin-table-body" class="divide-y">
            <!-- Dynamic Injection -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    // LISTEN FOR LIVE UPDATES ACROSS TABS
    if ('BroadcastChannel' in window) {
      const bc = new BroadcastChannel('js_sync_channel');
      bc.onmessage = (event) => {
        if (event.data.type === 'NEW_REQUEST') {
          renderAdminData();
        }
      };
    }

    function renderAdminData() {
      const records = JSON.parse(localStorage.getItem('js_global_requests')) || [];
      const tbody = document.getElementById('admin-table-body');
      
      document.getElementById('stat-total').innerText = records.length;
      document.getElementById('stat-pending').innerText = records.filter(r => r.status === 'Pending').length;
      document.getElementById('stat-resolved').innerText = records.filter(r => r.status === 'Resolved').length;

      if (records.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400">No public requests found in system database.</td></tr>`;
        return;
      }

      tbody.innerHTML = records.map((r, idx) => `
        <tr class="hover:bg-slate-50/80 transition">
          <td class="p-3 font-mono font-bold text-slate-900">${r.id}</td>
          <td class="p-3 font-bold">${r.name}<br><span class="text-[10px] text-slate-400 font-normal">${r.city}</span></td>
          <td class="p-3 text-slate-600">${r.phone}<br><span class="text-[10px] text-slate-400">${r.email}</span></td>
          <td class="p-3"><span class="bg-slate-100 px-2 py-0.5 rounded text-[10px] font-semibold">${r.category}</span></td>
          <td class="p-3 max-w-xs text-slate-600 truncate">${r.concern}</td>
          <td class="p-3">
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${r.status === 'Resolved' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
              ${r.status}
            </span>
          </td>
          <td class="p-3 text-right">
            <button onclick="toggleStatus(${idx})" class="px-2.5 py-1 text-[10px] font-bold rounded-lg bg-slate-900 text-white hover:bg-slate-800 transition">
              Toggle Status
            </button>
          </td>
        </tr>
      `).join('');
    }

    function toggleStatus(idx) {
      const records = JSON.parse(localStorage.getItem('js_global_requests')) || [];
      records[idx].status = records[idx].status === 'Pending' ? 'Resolved' : 'Pending';
      localStorage.setItem('js_global_requests', JSON.stringify(records));
      renderAdminData();
    }

    function clearAllData() {
      if (confirm("Are you sure you want to clear all requests?")) {
        localStorage.removeItem('js_global_requests');
        renderAdminData();
      }
    }

    // Initialize Dashboard Data
    window.onload = renderAdminData;
  </script>
</body>
</html>
