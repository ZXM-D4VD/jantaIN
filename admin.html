<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JanSeva - Master Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { saffron: { 500: '#ff9933', 600: '#ea580c' }, navy: { 800: '#031b33', 900: '#000080' } }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 flex flex-col min-h-screen">

  <header class="bg-navy-900 text-white px-6 py-4 shadow-md flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-saffron-500 flex items-center justify-center font-black">JS</div>
      <div>
        <h1 class="font-extrabold text-base">JanSeva Master Control Console</h1>
        <p class="text-[11px] text-slate-400">Database & Portal Operations</p>
      </div>
    </div>
    <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-xs px-4 py-2 rounded-xl font-bold border border-slate-700 transition">View Web Portal</a>
  </header>

  <main class="max-w-7xl mx-auto w-full px-6 py-6 flex-1 space-y-6">

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-white border rounded-2xl p-4 flex justify-between items-center shadow-sm">
        <div><p class="text-xs text-slate-500 font-bold uppercase">Requests</p><h3 id="stat-req-count" class="text-2xl font-black">0</h3></div>
        <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-lg"><i class="fa-solid fa-inbox"></i></div>
      </div>
      <div class="bg-white border rounded-2xl p-4 flex justify-between items-center shadow-sm">
        <div><p class="text-xs text-slate-500 font-bold uppercase">Causes</p><h3 id="stat-camp-count" class="text-2xl font-black">0</h3></div>
        <div class="w-10 h-10 bg-saffron-50 text-saffron-600 rounded-xl flex items-center justify-center text-lg"><i class="fa-solid fa-heart"></i></div>
      </div>
      <div class="bg-white border rounded-2xl p-4 flex justify-between items-center shadow-sm">
        <div><p class="text-xs text-slate-500 font-bold uppercase">Registered Users</p><h3 id="stat-usr-count" class="text-2xl font-black">0</h3></div>
        <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-lg"><i class="fa-solid fa-users"></i></div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

      <div class="lg:col-span-8 bg-white border rounded-3xl p-5 shadow-lg space-y-4">
        <div class="flex justify-between items-center border-b pb-3">
          <h3 class="font-extrabold text-base text-slate-900"><i class="fa-solid fa-list-check text-saffron-500"></i> Citizen Requests</h3>
          <button onclick="clearAllRequests()" class="text-red-500 text-xs font-bold">Clear All</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead>
              <tr class="bg-slate-50 border-b text-slate-600 font-bold">
                <th class="p-2.5">ID</th>
                <th class="p-2.5">Citizen Details</th>
                <th class="p-2.5">Category</th>
                <th class="p-2.5">Status</th>
                <th class="p-2.5 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="admin-req-tbody" class="divide-y"></tbody>
          </table>
        </div>
      </div>

      <div class="lg:col-span-4 bg-white border rounded-3xl p-5 shadow-lg space-y-4">
        <div class="border-b pb-3">
          <h3 class="font-extrabold text-base text-slate-900"><i class="fa-solid fa-square-plus text-saffron-500"></i> Add New Relief Cause</h3>
        </div>
        <form onsubmit="handleAddCampaign(event)" class="space-y-3 text-xs">
          <input type="text" id="camp-title" required placeholder="Title" class="w-full p-2.5 border rounded-xl">
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="camp-cat" required placeholder="Category" class="w-full p-2.5 border rounded-xl">
            <input type="text" id="camp-city" required placeholder="City" class="w-full p-2.5 border rounded-xl">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input type="number" id="camp-goal" required placeholder="Goal (₹)" class="w-full p-2.5 border rounded-xl">
            <input type="number" id="camp-raised" required placeholder="Raised (₹)" class="w-full p-2.5 border rounded-xl">
          </div>
          <input type="url" id="camp-img" required placeholder="Image URL" class="w-full p-2.5 border rounded-xl">
          <button type="submit" class="w-full bg-saffron-500 text-white font-extrabold py-2.5 rounded-xl">Publish Cause</button>
        </form>
      </div>

    </div>

  </main>

  <script>
    function loadAdminData() {
      const reqs = JSON.parse(localStorage.getItem('js_requests')) || [];
      const camps = JSON.parse(localStorage.getItem('js_campaigns')) || [];
      const users = JSON.parse(localStorage.getItem('js_users')) || [];

      document.getElementById('stat-req-count').innerText = reqs.length;
      document.getElementById('stat-camp-count').innerText = camps.length;
      document.getElementById('stat-usr-count').innerText = users.length;

      const tbody = document.getElementById('admin-req-tbody');
      tbody.innerHTML = '';

      if(reqs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">No requests recorded.</td></tr>`;
        return;
      }

      reqs.forEach((r) => {
        const isResolved = r.status === 'Resolved';
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 transition";
        tr.innerHTML = `
          <td class="p-2.5 font-bold text-saffron-600">${r.id}</td>
          <td class="p-2.5"><div class="font-bold">${r.name}</div><div class="text-[10px] text-slate-400">${r.phone} • ${r.city}</div></td>
          <td class="p-2.5">${r.category}</td>
          <td class="p-2.5"><span class="px-2 py-0.5 rounded-full font-bold text-[10px] ${isResolved ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${r.status}</span></td>
          <td class="p-2.5 text-right space-x-1">
            <button onclick="toggleReqStatus('${r.id}')" class="bg-navy-900 text-white text-[10px] px-2 py-1 rounded-lg">${isResolved ? 'Mark Pending' : 'Mark Resolved'}</button>
            <button onclick="deleteReq('${r.id}')" class="text-red-500 p-1"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function toggleReqStatus(id) {
      let reqs = JSON.parse(localStorage.getItem('js_requests')) || [];
      reqs = reqs.map(r => { if(r.id === id) r.status = (r.status === 'Resolved' ? 'Pending' : 'Resolved'); return r; });
      localStorage.setItem('js_requests', JSON.stringify(reqs));
      loadAdminData();
    }

    function deleteReq(id) {
      let reqs = JSON.parse(localStorage.getItem('js_requests')) || [];
      reqs = reqs.filter(r => r.id !== id);
      localStorage.setItem('js_requests', JSON.stringify(reqs));
      loadAdminData();
    }

    function clearAllRequests() {
      if(confirm("Delete all citizen requests?")) {
        localStorage.setItem('js_requests', JSON.stringify([]));
        loadAdminData();
      }
    }

    function handleAddCampaign(e) {
      e.preventDefault();
      const title = document.getElementById('camp-title').value;
      const category = document.getElementById('camp-cat').value;
      const city = document.getElementById('camp-city').value;
      const goal = Number(document.getElementById('camp-goal').value);
      const raised = Number(document.getElementById('camp-raised').value);
      const image = document.getElementById('camp-img').value;

      const camps = JSON.parse(localStorage.getItem('js_campaigns')) || [];
      camps.unshift({ id: 'C' + (camps.length + 1), title, category, city, goal, raised, image });
      localStorage.setItem('js_campaigns', JSON.stringify(camps));
      alert("Campaign Published!");
      e.target.reset();
      loadAdminData();
    }

    window.addEventListener('DOMContentLoaded', loadAdminData);
  </script>
</body>
</html>
