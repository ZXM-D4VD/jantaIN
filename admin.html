<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JanSeva - Admin Console</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --primary: #102a43; --bg: #f0f4f8; --card: #ffffff; --text: #102a43; --border: #bcccdc; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 1.5rem; }
    .header { display: flex; justify-content: space-between; align-items: center; background: var(--primary); color: white; padding: 1rem 1.5rem; border-radius: 10px; margin-bottom: 2rem; }
    .card { background: var(--card); padding: 1.5rem; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 2rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #e4e7eb; }
    input, select, textarea, button { padding: 0.6rem; border-radius: 6px; border: 1px solid var(--border); }
    button { background: #102a43; color: white; cursor: pointer; font-weight: 600; border: none; }
    .badge { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-resolved { background: #d1fae5; color: #065f46; }
    #login-gate { max-width: 400px; margin: 5rem auto; text-align: center; }
  </style>
</head>
<body>

  <div id="login-gate" class="card">
    <h2 style="margin-bottom: 1rem;"><i class="fa-solid fa-lock"></i> Admin Gate</h2>
    <input type="password" id="access-key" placeholder="Enter Access Passcode" style="width:100%; margin-bottom: 1rem;">
    <button onclick="authenticateAdmin()" style="width:100%;">Access Dashboard</button>
  </div>

  <div id="admin-panel" style="display:none;">
    <div class="header">
      <h2><i class="fa-solid fa-gauge"></i> JanSeva Admin Console</h2>
      <a href="index.html" style="color:white; text-decoration:none;"><i class="fa-solid fa-arrow-right-from-bracket"></i> Exit</a>
    </div>

    <!-- Live Requests -->
    <div class="card">
      <h3><i class="fa-solid fa-list-check"></i> Assistance Requests (Realtime)</h3>
      <table>
        <thead>
          <tr>
            <th>Ticket ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Category</th>
            <th>City</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="requests-table"></tbody>
      </table>
    </div>

    <!-- Campaign Publisher -->
    <div class="card">
      <h3><i class="fa-solid fa-bullhorn"></i> Publish New Campaign</h3>
      <form id="campaign-form" style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem; margin-top:1rem;">
        <input type="text" id="c-title" placeholder="Campaign Title" required>
        <input type="number" id="c-target" placeholder="Target Amount (₹)" required>
        <input type="text" id="c-icon" placeholder="FontAwesome Icon (e.g. fa-heart)" required>
        <textarea id="c-desc" placeholder="Campaign Description" style="grid-column: span 2;" required></textarea>
        <button type="submit" style="grid-column: span 2;">Publish Campaign</button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://your-project-id.supabase.co";
    const SUPABASE_ANON_KEY = "your-actual-anon-key";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function authenticateAdmin() {
      const key = document.getElementById('access-key').value;
      if (key === "9090") {
        document.getElementById('login-gate').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        loadAdminData();
        subscribeRealtime();
      } else {
        alert("Invalid Passcode!");
      }
    }

    async function loadAdminData() {
      const { data, error } = await supabaseClient.from('requests').select('*').order('created_at', { ascending: false });
      if (error) return alert(error.message);

      const tbody = document.getElementById('requests-table');
      tbody.innerHTML = data.map(r => `
        <tr>
          <td><b>${escapeHtml(r.ticket_id)}</b></td>
          <td>${escapeHtml(r.full_name)}</td>
          <td>${escapeHtml(r.email)}</td>
          <td>${escapeHtml(r.category)}</td>
          <td>${escapeHtml(r.city)}</td>
          <td><span class="badge ${r.status === 'Resolved' ? 'badge-resolved' : 'badge-pending'}">${escapeHtml(r.status)}</span></td>
          <td>
            <button onclick="toggleStatus('${r.id}', '${r.status}')" style="background:#2563eb; padding:0.3rem 0.6rem; font-size:0.8rem;">Toggle Status</button>
          </td>
        </tr>
      `).join('');
    }

    async function toggleStatus(id, currentStatus) {
      const nextStatus = currentStatus === 'Pending' ? 'Resolved' : 'Pending';
      await supabaseClient.from('requests').update({ status: nextStatus }).eq('id', id);
      loadAdminData();
    }

    document.getElementById('campaign-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        title: document.getElementById('c-title').value,
        target_amount: parseFloat(document.getElementById('c-target').value),
        raised_amount: 0,
        icon: document.getElementById('c-icon').value,
        description: document.getElementById('c-desc').value
      };
      await supabaseClient.from('campaigns').insert([payload]);
      alert('Campaign Published!');
      document.getElementById('campaign-form').reset();
    });

    function subscribeRealtime() {
      supabaseClient.channel('admin-live-requests')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'requests' }, () => loadAdminData())
        .subscribe();
    }
  </script>
</body>
</html>
